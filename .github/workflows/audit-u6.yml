      - name: Verify DTBO and MTK components
        run: |
          {
            echo "=== DTBO EXACT PAYLOAD COMPARISON ==="
            cmp -n 524111 firmware/dtbo.img out/recovery/recovery_dtbo \
              && echo "RESULT: PAYLOAD IDENTICAL" \
              || echo "RESULT: PAYLOAD DIFFERENT"

            echo
            echo "=== DTBO PAYLOAD HASHES ==="
            head -c 524111 firmware/dtbo.img | sha256sum
            sha256sum out/recovery/recovery_dtbo

            echo
            echo "=== MTK ODM BINARIES ==="
            find out/ramdisk-work/recovery/odm/bin \
              -maxdepth 1 -type f -printf '%f\n' | sort

            echo
            echo "=== MTK PATH UTILITY ==="
            find out/ramdisk-work/recovery \
              \( -name 'mtk_plpath_utils' -o -name '*plpath*' \)

            echo
            echo "=== HARDWARE PROPERTIES ==="
            grep -E \
              'ro.hardware=|ro.boot.hardware=|ro.board.platform=|ro.vendor.mediatek.platform=|ro.boot.dynamic_partitions=' \
              out/ramdisk-work/recovery/default.prop \
              out/ramdisk-work/recovery/prop.default || true
          } | tee out/reports/next-inspection.txt
